<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Mando · Pasaporte Digital</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div id="login" class="overlay hidden">
    <form id="login-form" class="login-card">
      <img id="login-logo" class="login-logo hidden" alt="">
      <span class="logo" id="login-icon">🛂</span>
      <h1>Centro de Mando</h1>
      <p class="muted small" id="login-event">Pasaporte Digital · panel del evento</p>
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password">
      <button class="btn primary" type="submit">Ingresar</button>
      <p id="login-err" class="err hidden"></p>
    </form>
  </div>

  <aside id="sidebar" class="sidebar hidden">
    <h1>🛂 Centro de Mando</h1>
    <p class="muted small" id="side-event"></p>
    <nav>
      <a data-view="resumen" class="active">📊 Resumen</a>
      <a data-view="stands">🏫 Stands</a>
      <a data-view="diseno">🎨 Diseño y marca</a>
      <a data-view="comentarios">💬 Comentarios</a>
      <a data-view="visitantes">🧑‍🎓 Visitantes</a>
      <a data-view="config">⚙️ Configuración</a>
    </nav>
    <button id="logout" class="link-btn">Cerrar sesión</button>
  </aside>

  <main id="main" class="main hidden"></main>
  <div id="toast" class="toast hidden"></div>

  <script src="/vendor/qrcode-generator.js"></script>
  <script src="/stamp-renderer.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
